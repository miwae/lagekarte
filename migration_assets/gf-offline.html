<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gefahrstoffdatei</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#0a1628;color:#f0f4f8;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#hdr{background:#0f0f1a;border-bottom:2px solid #e85d04;padding:.5rem 1rem;display:flex;align-items:center;gap:.8rem;flex-shrink:0;flex-wrap:wrap}
#hdr h1{font-size:.95rem;font-weight:800}#hdr h1 span{color:#e85d04}
.badge{font-size:.65rem;background:rgba(232,93,4,.12);border:1px solid rgba(232,93,4,.3);color:#e85d04;padding:.12rem .45rem;border-radius:3px}
#srch{background:#112240;border:1.5px solid rgba(232,93,4,.2);color:#f0f4f8;border-radius:5px;padding:.32rem .6rem;font-size:.8rem;flex:1;max-width:240px;min-width:120px}
#srch:focus{outline:none;border-color:#e85d04}
#srch::placeholder{color:#3a5070}
#cnt{font-size:.68rem;color:#4a6080;white-space:nowrap}
#body{flex:1;display:flex;overflow:hidden}
#list{flex:1;overflow-y:auto;padding:.8rem}
#list::-webkit-scrollbar{width:4px}#list::-webkit-scrollbar-thumb{background:#e85d04;border-radius:2px}
.cat-hdr{font-size:.68rem;color:#e85d04;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin:1rem 0 .4rem;padding-bottom:.25rem;border-bottom:1px solid rgba(232,93,4,.15)}
.cat-hdr:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:.5rem;margin-bottom:.25rem}
.card{background:#0d1b2a;border:1.5px solid rgba(232,93,4,.1);border-radius:8px;padding:.5rem .4rem;cursor:pointer;transition:all .14s;display:flex;flex-direction:column;align-items:center;gap:.3rem}
.card:hover,.card.sel{border-color:#e85d04;background:#1a3050;transform:translateY(-1px)}
.card.sel{box-shadow:0 0 0 2px rgba(232,93,4,.3)}
.card img{width:76px;height:76px;object-fit:contain;border-radius:5px;background:white;padding:3px;display:block;flex-shrink:0}
.cname{font-size:.62rem;color:#c8d4e0;text-align:center;line-height:1.25;font-weight:600;word-break:break-word}
#detail{width:280px;flex-shrink:0;background:#0d1b2a;border-left:1px solid rgba(232,93,4,.15);padding:.8rem;overflow-y:auto;display:flex;flex-direction:column;gap:.6rem}
#detail::-webkit-scrollbar{width:4px}#detail::-webkit-scrollbar-thumb{background:#e85d04;border-radius:2px}
#det-img-wrap{width:160px;height:160px;margin:0 auto;background:white;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
#det-img-wrap img{width:148px;height:148px;object-fit:contain}
#det-name{font-size:.92rem;font-weight:800;color:#f0f4f8;text-align:center;line-height:1.3}
#det-cat{font-size:.65rem;color:#e85d04;text-align:center;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
#det-signal{font-size:.72rem;text-align:center;padding:.2rem .6rem;border-radius:4px;background:rgba(232,93,4,.1);color:#e85d04;font-weight:700;width:fit-content;margin:0 auto}
#det-desc{font-size:.76rem;color:#8ba0b4;line-height:1.55;background:#112240;border-radius:5px;padding:.45rem .55rem}
#det-schutz{font-size:.74rem;color:#22c55e;line-height:1.5;background:rgba(34,197,94,.05);border:1px solid rgba(34,197,94,.15);border-radius:5px;padding:.4rem .55rem}
#det-empty{color:#3a5070;font-size:.76rem;text-align:center;margin-top:3rem;line-height:1.8}

/* ====== GESTIS-LINK ====== */
#gestis-bar{background:#112240;border-top:1px solid rgba(232,93,4,.15);
  padding:.4rem .8rem;display:flex;align-items:center;gap:.5rem;flex-shrink:0}
#gestis-bar label{font-size:.68rem;color:#4a6080;white-space:nowrap}
#gestis-input{background:#0a1628;border:1.5px solid rgba(232,93,4,.2);color:#f0f4f8;
  border-radius:4px;padding:.25rem .5rem;font-size:.75rem;flex:1;min-width:0}
#gestis-input:focus{outline:none;border-color:#e85d04}
#gestis-btn{background:#e85d04;border:none;color:#fff;padding:.25rem .7rem;
  border-radius:4px;cursor:pointer;font-size:.72rem;font-weight:700;white-space:nowrap}
#gestis-btn:hover{background:#f97316}
#gestis-links{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.glink{font-size:.65rem;color:#4a6080;text-decoration:none;padding:.15rem .35rem;
  border:1px solid rgba(232,93,4,.15);border-radius:3px;white-space:nowrap}
.glink:hover{color:#e85d04;border-color:#e85d04}


/* ====== H/P-SATZ NACHSCHLAGEN ====== */
#hp-panel{position:absolute;top:0;right:0;width:320px;height:100%;
  background:#0a1628;border-left:1.5px solid rgba(232,93,4,.25);
  display:none;flex-direction:column;z-index:500}
#hp-panel.open{display:flex}
#hp-hdr{background:#0f0f1a;padding:.5rem .7rem;border-bottom:1px solid rgba(232,93,4,.2);
  display:flex;align-items:center;gap:.5rem;flex-shrink:0}
#hp-hdr h3{font-size:.78rem;font-weight:800;color:#e85d04;flex:1}
#hp-close{background:none;border:none;color:#4a6080;cursor:pointer;font-size:.9rem;padding:.1rem}
#hp-close:hover{color:#e85d04}
#hp-search-wrap{padding:.5rem .6rem;border-bottom:1px solid rgba(232,93,4,.1);flex-shrink:0}
#hp-input{width:100%;background:#112240;border:1.5px solid rgba(232,93,4,.2);
  color:#f0f4f8;border-radius:5px;padding:.3rem .5rem;font-size:.78rem}
#hp-input:focus{outline:none;border-color:#e85d04}
#hp-tabs{display:flex;border-bottom:1px solid rgba(232,93,4,.1);flex-shrink:0}
.hp-tab{flex:1;padding:.3rem;font-size:.7rem;font-weight:700;color:#4a6080;
  cursor:pointer;text-align:center;border-bottom:2px solid transparent}
.hp-tab.active{color:#e85d04;border-bottom-color:#e85d04}
#hp-list{flex:1;overflow-y:auto;padding:.4rem .5rem}
#hp-list::-webkit-scrollbar{width:3px}
#hp-list::-webkit-scrollbar-thumb{background:#e85d04;border-radius:2px}
.hp-item{padding:.3rem .4rem;margin-bottom:.2rem;border-radius:4px;cursor:pointer;
  border:1px solid transparent;transition:all .1s}
.hp-item:hover{background:#112240;border-color:rgba(232,93,4,.2)}
.hp-code{font-size:.72rem;font-weight:800;color:#e85d04;font-family:monospace}
.hp-code.H{color:#ef4444}.hp-code.P{color:#f59e0b}.hp-code.EUH{color:#a855f7}
.hp-text{font-size:.68rem;color:#c8d4e0;line-height:1.35;margin-top:.1rem}
#hp-detail{padding:.5rem .7rem;background:#112240;border-top:1px solid rgba(232,93,4,.1);
  display:none;flex-shrink:0}
#hp-detail .hp-code{font-size:.82rem}
#hp-detail .hp-text{font-size:.74rem;color:#f0f4f8;margin-top:.3rem;line-height:1.5}
#hp-gestis-hint{font-size:.65rem;color:#4a6080;margin-top:.4rem;text-align:center}
#hp-gestis-hint a{color:#e85d04;text-decoration:none}

/* Layout-Anpassung wenn HP-Panel offen */
#body.hp-open #list{margin-right:320px}
#body.hp-open #detail{display:none}

</style>
</head>
<body>
<div id="hdr">
  <h1>&#9762;&#65039; Gefahrstoff<span>datei</span></h1>
  <span class="badge">GHS</span><span class="badge">ASR A1.3</span><span class="badge">ISO 7010</span><span class="badge" style="cursor:pointer;background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:#ef4444" onclick="toggleHPPanel()" title="H/P-Satz Nachschlagewerk">📋 H/P-Sätze</span>
  <input id="srch" placeholder="&#128269; Suchen..." oninput="search(this.value)">
  <span id="cnt"></span>
</div>

<div id="gestis-bar">
  <label>🔬 GESTIS:</label>
  <input id="gestis-input" placeholder="Stoff suchen... (Name, CAS-Nr., z.B. Benzol, 71-43-2)" 
    onkeydown="if(event.key==='Enter')gestisSearch()">
  <button id="gestis-btn" onclick="gestisSearch()">🔍 DGUV GESTIS</button>
  <div id="gestis-links">
    <a class="glink" href="https://gestis.dguv.de/" target="_blank" title="GESTIS Startseite">📖 GESTIS</a>
    <a class="glink" href="https://gestis.dguv.de/search" target="_blank" title="GESTIS Suche">🔎 Suche</a>
    <a class="glink" href="https://www.dguv.de/ifa/gestis/gestis-internationale-grenzwerte-fuer-chemische-substanzen-limit-values-for-chemical-agents/index.jsp" target="_blank" title="Grenzwerte">📊 AGW</a>
    <a class="glink" href="https://www.dguv.de/ifa/gestis/gestis-biostoffdatenbank/index.jsp" target="_blank" title="Biostoffe">🦠 Biostoffe</a>
  </div>
</div>
<div id="body">
  <div id="list"><div id="content"></div></div>
  <div id="detail">
    <div id="det-empty">&#8592; Zeichen anklicken<br>f&#252;r Details</div>
    <div id="det-full" style="display:none;flex-direction:column;gap:.6rem">
      <div id="det-img-wrap"><img id="det-img" src="" alt=""></div>
      <div id="det-name"></div>
      <div id="det-cat"></div>
      <div id="det-signal"></div>
      <div id="det-desc"></div>
      <div id="det-schutz" style="display:none"></div>
    </div>
  </div>
</div>

var sel=null,_q='';

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function shortN(name){
  return name.replace(/^[A-Z]+\d+[a-z]?\s*[\u2013-]\s*/,'').replace(/\s*\(Gefahr.*?\)/g,'').trim();
}

function render(items){
  var groups={};
  items.forEach(function(d){groups[d.cat]=groups[d.cat]||[];groups[d.cat].push(d);});
  var html='';
  Object.keys(groups).forEach(function(cat){
    html+='<div class="cat-hdr">'+esc(cat)+' &mdash; '+groups[cat].length+' Zeichen</div><div class="grid">';
    groups[cat].forEach(function(d){
      var sid=encodeURIComponent(d.id);
      html+='<div class="card'+(sel===d.id?' sel':'')+'" onclick="pick(decodeURIComponent(\''+sid+'\'))">'+
        '<img src="'+esc(d.img)+'" alt="" loading="lazy" onerror="this.style.opacity=.3">'+
        '<div class="cname">'+esc(shortN(d.name))+'</div></div>';
    });
    html+='</div>';
  });
  document.getElementById('content').innerHTML=html;
  document.getElementById('cnt').textContent=items.length+' Eintr\u00e4ge';
}

function pick(id){
  sel=id;
  var d=DATA.find(function(x){return x.id===id;});
  if(!d)return;
  render(currentItems());
  document.getElementById('det-empty').style.display='none';
  var full=document.getElementById('det-full');
  full.style.display='flex';
  document.getElementById('det-img').src=d.img;
  document.getElementById('det-name').textContent=d.name;
  document.getElementById('det-cat').textContent=d.cat;
  var sig=document.getElementById('det-signal');
  if(d.signal){sig.textContent='Signal: '+d.signal;sig.style.display='block';}
  else sig.style.display='none';
  document.getElementById('det-desc').textContent=d.desc||'';
  var sc=document.getElementById('det-schutz');
  if(d.schutz){sc.style.display='block';sc.textContent='\u2705 '+d.schutz;}
  else sc.style.display='none';
}

function currentItems(){
  if(!_q)return DATA;
  var s=_q.toLowerCase();
  return DATA.filter(function(d){
    return d.name.toLowerCase().includes(s)||d.cat.toLowerCase().includes(s)||
      (d.desc||'').toLowerCase().includes(s)||(d.signal||'').toLowerCase().includes(s);
  });
}
function search(q){_q=q;render(currentItems());}

render(DATA);


function gestisSearch(){
  var q=document.getElementById('gestis-input').value.trim();
  if(!q)return;
  // Prüfe ob CAS-Nummer (Format: XXXXXX-XX-X)
  var isCAS=/^\d{2,7}-\d{2}-\d$/.test(q);
  var url;
  if(isCAS){
    url='https://gestis.dguv.de/search?cas='+encodeURIComponent(q);
  } else {
    url='https://gestis.dguv.de/search?name='+encodeURIComponent(q);
  }
  window.open(url,'_blank','noopener');
}

// Detail-Ansicht: GESTIS-Link hinzufügen
var _origPick=window.pick;
window.pick=function(id){
  _origPick(id);
  // GESTIS-Suchfeld mit Stoffname befüllen
  var d=DATA.find(function(x){return x.id===id;});
  if(d){
    var cleanName=d.name
      .replace(/^[A-Z]{1,4}[0-9]{1,4}[a-z]?\s*[–\-]\s*/,'')
      .replace(/\s*\(Gefahr.*?\)/g,'')
      .replace(/_T$/,'').trim();
    document.getElementById('gestis-input').value=cleanName;
    
    // GESTIS-Link direkt in Detail-Panel einbauen
    var sc=document.getElementById('det-schutz');
    if(sc){
      // Link ans Ende des Panels
      var existing=document.getElementById('det-gestis-link');
      if(!existing){
        var lnk=document.createElement('a');
        lnk.id='det-gestis-link';
        lnk.style.cssText='display:block;margin-top:.4rem;font-size:.7rem;color:#4a6080;text-decoration:none;';
        lnk.textContent='🔬 In GESTIS-Datenbank nachschlagen →';
        lnk.onmouseover=function(){this.style.color='#e85d04';};
        lnk.onmouseout=function(){this.style.color='#4a6080';};
        document.getElementById('det-info-wrap').after(lnk);
      }
      var glink=document.getElementById('det-gestis-link');
      if(glink){
        var gurl='https://gestis.dguv.de/search?name='+encodeURIComponent(cleanName);
        glink.href=gurl;
        glink.target='_blank';
        glink.rel='noopener';
      }
    }
  }
};

var hpTab='H', hpPanelOpen=false;

function toggleHPPanel(){
  hpPanelOpen=!hpPanelOpen;
  var panel=document.getElementById('hp-panel');
  var body=document.getElementById('body');
  panel.classList.toggle('open',hpPanelOpen);
  body.classList.toggle('hp-open',hpPanelOpen);
  if(hpPanelOpen){hpRender('');document.getElementById('hp-input').focus();}
}

function hpSetTab(t,btn){
  hpTab=t;
  document.querySelectorAll('.hp-tab').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  hpRender(document.getElementById('hp-input').value);
}

function hpSearch(q){hpRender(q);}

function hpRender(q){
  var list=document.getElementById('hp-list');
  q=(q||'').toLowerCase().trim();
  var items=[];
  
  // H-Sätze
  if(hpTab==='H'||hpTab==='ALL'){
    Object.keys(HP_DATA.h).forEach(function(code){
      var txt=HP_DATA.h[code];
      if(!q||code.toLowerCase().includes(q)||txt.toLowerCase().includes(q)){
        items.push({code:code,txt:txt,type:'H'});
      }
    });
  }
  // P-Sätze
  if(hpTab==='P'||hpTab==='ALL'){
    Object.keys(HP_DATA.p).forEach(function(code){
      var txt=HP_DATA.p[code];
      if(!q||code.toLowerCase().includes(q)||txt.toLowerCase().includes(q)){
        items.push({code:code,txt:txt,type:'P'});
      }
    });
  }
  
  // Sortieren
  items.sort(function(a,b){
    var na=parseInt(a.code.replace(/\D/g,''));
    var nb=parseInt(b.code.replace(/\D/g,''));
    return na-nb;
  });
  
  // HTML
  var html='';
  if(!items.length){
    html='<div style="color:#3a5070;font-size:.72rem;text-align:center;margin-top:1rem">Keine Treffer</div>';
  }
  items.forEach(function(item){
    // Treffer hervorheben
    var txt=item.txt;
    if(q&&q.length>1){
      var re2=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
      txt=txt.replace(re2,'<mark style="background:rgba(232,93,4,.25);color:#e85d04;border-radius:2px">$1</mark>');
    }
    html+='<div class="hp-item" onclick="hpShowDetail(\''+item.code+'\')">'+
      '<div class="hp-code '+item.type+'">'+item.code+'</div>'+
      '<div class="hp-text">'+txt+'</div>'+
      '</div>';
  });
  list.innerHTML=html;
}

function hpShowDetail(code){
  var txt=(HP_DATA.h[code]||HP_DATA.p[code]||'');
  var type=code.startsWith('H')?'H':'P';
  document.getElementById('hp-det-code').textContent=code;
  document.getElementById('hp-det-code').className='hp-code '+type;
  document.getElementById('hp-det-text').textContent=txt;
  document.getElementById('hp-detail').style.display='block';
  // In Zwischenablage kopieren
  navigator.clipboard.writeText(code+': '+txt).catch(function(){});
}

// Beim Klick auf ein Zeichen: H-Sätze aus info befüllen
var _origPickGF=window.pick;
window.pick=function(id){
  _origPickGF(id);
  // H-Satz aus Info extrahieren falls vorhanden
  var d=DATA.find(function(x){return x.id===id;});
  if(d&&d.info){
    var signal=d.info['Signal']||'';
    if(signal&&hpPanelOpen){
      // Passende H-Sätze anzeigen
      var searchterm=d.name.replace(/^[A-Z]+\d+\s*[–-]\s*/,'').replace(/\s*\(.*?\)/g,'').trim();
      document.getElementById('hp-input').value=searchterm;
      hpRender(searchterm);
    }
  }
};

// Initial rendern wenn Panel geöffnet wird
if(hpPanelOpen) hpRender('');

</script>
