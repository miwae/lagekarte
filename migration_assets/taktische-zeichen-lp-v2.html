function sanitizeEntries(entries){
  var nameFixes={
    'TZ InformationUndKommunikation':'TZ Information und Kommunikation',
    'Bereitstellungsrau mit Führungsstelle':'Bereitstellungsraum mit Führungsstelle',
    'Bereitstellungsrau mit Meldekopf':'Bereitstellungsraum mit Meldekopf',
    'Person Regie ':'Person Regie',
    'Schnell-Einsatz-Gruppe PSNV  ohne Stärke':'Schnell-Einsatz-Gruppe PSNV ohne Stärke',
    'Kraftfahrzeug Geländegängig':'Kraftfahrzeug geländegängig',
    'Sammelplatz für betroffene':'Sammelplatz für Betroffene',
    'Angeschlagener Raum - schwalbennest':'Angeschlagener Raum - Schwalbennest'
  };
  var groupFixes={
    'taktische Einheiten':'Taktische Einheiten'
  };
  var seen={};
  return entries.reduce(function(acc,entry){
    if(/^gf_/i.test(entry.id)) return acc;
    var next=Object.assign({},entry);
    if(nameFixes[next.n]) next.n=nameFixes[next.n];
    if(groupFixes[next.g]) next.g=groupFixes[next.g];
    if(typeof next.n==='string') next.n=next.n.replace(/\s{2,}/g,' ').trim();
    if(typeof next.g==='string') next.g=next.g.replace(/\s{2,}/g,' ').trim();
    var key=(next.g||'')+'\u0000'+(next.n||'');
    if(seen[key]) return acc;
    seen[key]=true;
    acc.push(next);
    return acc;
  },[]);
}

function updateTags(){
  var tags=document.getElementById('dr-tags');
  if(!tags)return;
  if(DR_SEL.length===0){tags.innerHTML='<span style="color:#4a6080;font-size:.78rem">Noch keine Zeichen ausgewählt</span>';return;}
  tags.innerHTML=DR_SEL.map(function(id){var z=ALL.find(function(x){return x.id===id;});return z?'<span class="tz-sel-tag" data-id="'+id+'">'+z.n+' &#10005;</span>':'';}).join('');
}

function buildLabelPage(forPrint){
  var bwPx=mm2px(drState.bw), bhPx=mm2px(drState.bh);
  var mtPx=mm2px(drState.mt), mlPx=mm2px(drState.ml);
  var ghPx=mm2px(drState.gh), gvPx=mm2px(drState.gv);
  var rows=Math.max(1,Math.round(drState.rows)), cols=Math.max(1,Math.round(drState.cols));
  var a4w=mm2px(210), a4h=mm2px(297);
  var scale=forPrint?1:Math.min(400/a4w,550/a4h);
  var pad=4;
  
  var startIdx=(drState.startRow-1)*cols+(drState.startCol-1);
  var cells='';
  var selItems=DR_SEL.map(function(id){return ALL.find(function(z){return z.id===id;});}).filter(Boolean);
  var total=rows*cols;
  var idx=0;
  
  for(var r=0;r<rows;r++){
    for(var cc=0;cc<cols;cc++){
      var cellIdx=r*cols+cc;
      var x=mlPx+cc*(bwPx+ghPx);
      var y=mtPx+r*(bhPx+gvPx);
      var dataIdx=cellIdx-startIdx;
      var z=dataIdx>=0&&dataIdx<selItems.length?selItems[dataIdx]:null;
      var svgSize=Math.min(bwPx*scale-pad*2, bhPx*scale-(drState.showName?12:0)-pad*2, forPrint?80:60);
      var svgHtml='';
      if(z){
        if(CACHE[z.f]){
          var txt=CACHE[z.f];
          txt=txt.replace(/<\?xml[^?]*\?>/g,'').replace(/<!--[\s\S]*?-->/g,'').replace(/<\!DOCTYPE[^>]*>/g,'');
          txt=txt.replace(/(<svg\b[^>]*)\s+width="[^"]*"/,'$1').replace(/(<svg\b[^>]*)\s+height="[^"]*"/,'$1').replace(/(<svg\b[^>]*)\s+style="[^"]*"/,'$1');
          txt=txt.replace('<svg ','<svg width="'+svgSize+'" height="'+svgSize+'" ');
          svgHtml=txt;
        } else {
          svgHtml='<img src="'+BASE+encodeURIComponent(z.f)+'" width="'+svgSize+'" height="'+svgSize+'" style="object-fit:contain">';
        }
      }
      cells+='<div class="tz-label-cell" style="'+
        'left:'+(x*scale)+'px;top:'+(y*scale)+'px;'+
        'width:'+(bwPx*scale)+'px;height:'+(bhPx*scale)+'px;'+
        'padding:'+pad+'px;background:'+(z?'#fff':'transparent')+';'+
        (z&&!forPrint?'outline:1px dashed #ccc;':'border:1px dashed #e0e0e0;')+
        '">';
      if(z){cells+=svgHtml;if(drState.showName)cells+='<div class="tz-label-name">'+z.n+'</div>';}
      cells+='</div>';
    }
  }
  
  return '<div class="tz-label-page" style="width:'+(a4w*scale)+'px;height:'+(a4h*scale)+'px">'+cells+'</div>';
}

function drPreview(){
  var pv=document.getElementById('tz-preview');
  if(!pv)return;
  pv.innerHTML=buildLabelPage(false);
  // SVGs nachladen falls noch nicht im Cache
  if(DR_SEL.length>0){
    DR_SEL.slice(0,20).forEach(function(id){
      var z=ALL.find(function(x){return x.id===id;});
      if(z&&!CACHE[z.f]){
        fetch(BASE+encodeURIComponent(z.f)).then(function(r){return r.text();}).then(function(t){CACHE[z.f]=t;drPreview();}).catch(function(){});
      }
    });
  }
}

function doPrint(){
  // Alle Zeichen vorladen
  var toLoad=DR_SEL.filter(function(id){var z=ALL.find(function(x){return x.id===id;});return z&&!CACHE[z.f];});
  var loaded=0;
  if(toLoad.length===0){openPrintWindow();return;}
  toLoad.forEach(function(id){
    var z=ALL.find(function(x){return x.id===id;});
    fetch(BASE+encodeURIComponent(z.f)).then(function(r){return r.text();}).then(function(t){CACHE[z.f]=t;loaded++;if(loaded===toLoad.length)openPrintWindow();}).catch(function(){loaded++;if(loaded===toLoad.length)openPrintWindow();});
  });
}

function openPrintWindow(){
  var bwMm=drState.bw,bhMm=drState.bh,rows=Math.round(drState.rows),cols=Math.round(drState.cols);
  var startIdx=(drState.startRow-1)*cols+(drState.startCol-1);
  var selItems=DR_SEL.map(function(id){return ALL.find(function(z){return z.id===id;});}).filter(Boolean);
  var pad=2;
  
  var cells='';
  for(var r=0;r<rows;r++){
    for(var cc=0;cc<cols;cc++){
      var cellIdx=r*cols+cc;
      var dataIdx=cellIdx-startIdx;
      var z=dataIdx>=0&&dataIdx<selItems.length?selItems[dataIdx]:null;
      var svgSize=Math.min(bwMm*3.7795-pad*2, bhMm*3.7795-(drState.showName?10:0)-pad*2, 80);
      var svgHtml='';
      if(z&&CACHE[z.f]){
        var txt=CACHE[z.f];
        txt=txt.replace(/<\?xml[^?]*\?>/g,'').replace(/<!--[\s\S]*?-->/g,'').replace(/<\!DOCTYPE[^>]*>/g,'');
        txt=txt.replace(/(<svg\b[^>]*)\s+width="[^"]*"/,'$1').replace(/(<svg\b[^>]*)\s+height="[^"]*"/,'$1').replace(/(<svg\b[^>]*)\s+style="[^"]*"/,'$1');
        txt=txt.replace('<svg ','<svg width="'+svgSize+'" height="'+svgSize+'" ');
        svgHtml=txt;
      }
      var x=drState.ml+cc*(bwMm+drState.gh);
      var y=drState.mt+r*(bhMm+drState.gv);
      cells+='<div style="position:absolute;left:'+x+'mm;top:'+y+'mm;width:'+bwMm+'mm;height:'+bhMm+'mm;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:'+pad+'px;box-sizing:border-box">';
      if(z){cells+=svgHtml;if(drState.showName)cells+='<div style="font-size:7pt;text-align:center;color:#000;line-height:1.2;margin-top:1px;font-family:Arial,sans-serif;word-break:break-word;max-width:100%">'+z.n+'</div>';}
      cells+='</div>';
    }
  }
  
  var win=window.open('','_blank');
  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Etiketten Druck</title><style>@page{size:A4;margin:0}html,body{margin:0;padding:0;width:210mm;height:297mm}body{position:relative;overflow:hidden}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}svg{display:block}</style></head><body><div style="position:relative;width:210mm;height:297mm">'+cells+'</div></body></html>');
  win.document.close();
  win.onload=function(){
    // viewBox für alle SVGs fixen
    win.document.querySelectorAll('svg').forEach(function(svg){
      try{var b=svg.getBBox();if(b&&b.width>1&&b.height>1){var p=Math.max(b.width,b.height)*0.06;svg.setAttribute('viewBox',(b.x-p).toFixed(1)+' '+(b.y-p).toFixed(1)+' '+(b.width+p*2).toFixed(1)+' '+(b.height+p*2).toFixed(1));}}catch(e){}
    });
    setTimeout(function(){win.print();},400);
  };
}

function render(){badge();if(mod==='k')rK();else if(mod==='q')rQ(false);else if(mod==='r')rQ(true);else if(mod==='g')rG();else if(mod==='s')rS();else if(mod==='d')rD();}
render();
})();</script>
