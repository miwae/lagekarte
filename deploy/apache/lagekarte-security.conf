# Apache hardening profile for planungs-tool.de (WordPress)
#
# Enable modules:
#   a2enmod headers ssl rewrite
#
# Recommended global directives (apache2.conf), not inside vhost:
#   ServerTokens Prod
#   ServerSignature Off
#   TraceEnable Off

<VirtualHost *:80>
    ServerName planungs-tool.de
    ServerAlias www.planungs-tool.de

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName planungs-tool.de
    ServerAlias www.planungs-tool.de
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/planungs-tool.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/planungs-tool.de/privkey.pem

    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off

    # Baseline security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(self), microphone=(), camera=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"

    # CSP with low break risk for WordPress frontend/admin
    Header always set Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

    # Prevent MIME confusion for SVG and static files
    AddType image/svg+xml .svg

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # Block direct access to sensitive files
    <LocationMatch "^/(\.git|\.env|\.ht|composer\.(json|lock)|package(-lock)?\.json)$">
        Require all denied
    </LocationMatch>

    # Block XML-RPC if not explicitly required
    <Location "/xmlrpc.php">
        Require all denied
    </Location>

    # Hide REST user enumeration endpoints from anonymous access
    <LocationMatch "^/wp-json/wp/v2/users(/.*)?$">
        Require all denied
    </LocationMatch>

    # Block classic author-id enumeration pattern
    RewriteEngine On
    RewriteCond %{QUERY_STRING} (^|&)author=\d+(&|$) [NC]
    RewriteRule ^ / [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/planungs-tool_error.log
    CustomLog ${APACHE_LOG_DIR}/planungs-tool_access.log combined
</VirtualHost>
