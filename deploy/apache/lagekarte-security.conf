# Apache hardening template for lagekarte
# Enable required modules:
#   a2enmod headers ssl rewrite

# HTTP -> HTTPS redirect
<VirtualHost *:80>
    ServerName lagekarte.example.org
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

# HTTPS vhost
<VirtualHost *:443>
    ServerName lagekarte.example.org
    DocumentRoot /var/www/lagekarte

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/lagekarte.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/lagekarte.example.org/privkey.pem

    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off

    # Security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(self), microphone=(), camera=()"

    # Start strict and relax only where needed
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

    # Prevent MIME confusion for SVG and static files
    AddType image/svg+xml .svg

    <Directory /var/www/lagekarte>
        AllowOverride None
        Require all granted
        Options -Indexes
    </Directory>

    # Deny access to hidden files except well-known
    <LocationMatch "^/(\.git|\.env|\.ht|composer\.(json|lock)|package(-lock)?\.json)$">
        Require all denied
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/lagekarte_error.log
    CustomLog ${APACHE_LOG_DIR}/lagekarte_access.log combined
</VirtualHost>
